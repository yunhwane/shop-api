name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 진행 중이던 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gradle 툴체인이 JDK 25 를 요구한다. 여기서 미리 깔아두지 않으면
      # 빌드 중에 툴체인을 내려받느라 느려지거나 실패한다.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # 의존성/빌드 캐시와 Gradle 실행 환경을 준비한다.
      # 예전의 gradle/gradle-build-action 은 archived 되어 이걸로 대체됐다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Test
        run: ./gradlew build

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
          retention-days: 7
          if-no-files-found: ignore
