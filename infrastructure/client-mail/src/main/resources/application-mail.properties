# 메일 어댑터 기본 설정. api 의 application.properties 가 spring.config.import 로 불러온다.
# storage-db 의 application-storage.properties 와 같은 방식이다.

# resend | smtp
mail.provider=resend
mail.from=Shop <no-reply@example.com>

# 인증 링크가 향할 프론트엔드 페이지. API 를 직접 가리키지 않는다(ADR 0002).
mail.verification-url=http://localhost:3000/verify

# 운영에서는 환경변수 RESEND_API_KEY 로 주입한다. 저장소에 키를 커밋하지 않는다.
mail.resend.api-key=${RESEND_API_KEY:}
mail.resend.endpoint=https://api.resend.com/emails

# 메일 게이트웨이 응답 대기 한도
mail.read-timeout=5s
