# 결제 어댑터 기본 설정. api 의 application.properties 가 spring.config.import 로 불러온다.
# storage-db 의 application-storage.properties 와 같은 방식이다.

# toss | fake
payment.toss.provider=toss

# 운영에서는 환경변수 TOSS_SECRET_KEY 로 주입한다. 저장소에 키를 커밋하지 않는다.
payment.toss.secret-key=${TOSS_SECRET_KEY:}
payment.toss.confirm-endpoint=https://api.tosspayments.com/v1/payments/confirm

# 결제 게이트웨이 응답 대기 한도
payment.toss.read-timeout=5s
