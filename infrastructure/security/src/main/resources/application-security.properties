# 보안 어댑터 기본 설정. api 의 application.properties 가 spring.config.import 로 불러온다.

# 비워 두면 기동 시 임의의 키를 만들고 경고를 남긴다(ADR 0008).
# 저장소에 개발용 기본 키를 적어 두지 않는다. 그 값이 그대로 운영까지 흘러간다.
security.jwt.secret=${JWT_SECRET:}

security.jwt.access-token-ttl=30m
security.jwt.refresh-token-ttl=14d

# bcrypt 강도. 테스트에서는 낮춰 잡는다.
security.bcrypt.strength=10
