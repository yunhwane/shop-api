spring.application.name=shop-api

# 각 인프라 모듈이 제공하는 설정을 불러온다.
spring.config.import=classpath:application-storage.properties,classpath:application-mail.properties,classpath:application-security.properties,classpath:application-toss.properties

# 남용 방지 호출 제한(ADR 0009). 인메모리라 인스턴스마다 따로 세고 재시작하면 초기화된다.
security.rate-limit.verification-per-ip.limit=10
security.rate-limit.verification-per-ip.window=1h
security.rate-limit.verification-per-email.limit=3
security.rate-limit.verification-per-email.window=1h
security.rate-limit.login-failure-per-ip.limit=20
security.rate-limit.login-failure-per-ip.window=5m

# 만료 데이터 정리 배치(ADR 0010)
maintenance.cleanup.enabled=true
maintenance.cleanup.initial-delay=5m
maintenance.cleanup.interval=1h

# 로컬 실행용 카탈로그 시드. 상품 쓰기 API 가 없고 H2 가 재시작마다 비어서 필요하다.
# 기본값은 꺼짐이다. 켠 채로 두면 기동할 때마다 같은 샘플이 다시 들어가, 데이터가 남는
# DB 에서는 재시작한 횟수만큼 가짜 상품이 쌓인다.
catalog.seed=false
